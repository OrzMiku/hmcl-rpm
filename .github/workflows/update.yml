name: Update HMCL packages

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-hmcl
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Check upstream releases
        id: update
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          curl --fail --silent --show-error \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --output "$RUNNER_TEMP/hmcl-releases.json" \
            "https://api.github.com/repos/HMCL-dev/HMCL/releases?per_page=100"

          latest() {
            jq -r --arg pattern "$1" \
              '[.[] | select(.draft == false) | .tag_name | select(test($pattern))][0] | ltrimstr("v")' \
              "$RUNNER_TEMP/hmcl-releases.json"
          }

          changed=()
          update_spec() {
            local spec="$1" version="$2" current
            current="$(awk '$1 == "Version:" { print $2; exit }' "$spec")"

            [[ "$version" =~ ^[0-9]+(\.[0-9]+)+$ ]] || {
              echo "Invalid upstream version: $version" >&2
              exit 1
            }
            [[ "$version" == "$current" ]] && return
            [[ "$(printf '%s\n%s\n' "$current" "$version" | sort -V | tail -n 1)" == "$version" ]] || {
              echo "Refusing to downgrade $spec from $current to $version" >&2
              exit 1
            }

            sed -i -E "s/^Version:[[:space:]]+.*/Version:        $version/" "$spec"
            sed -i "/^%changelog$/a * $(LC_ALL=C date '+%a %b %d %Y') OrzMiku <miku@ecy.pink> - $version-1" "$spec"
            changed+=("$spec")
          }

          update_spec hmcl-stable.spec "$(latest '^v[0-9]+\.[0-9]+\.[0-9]+$')"
          update_spec hmcl-beta.spec "$(latest '^v[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$')"
          git diff --check
          printf 'specs=%s\n' "${changed[*]}" >> "$GITHUB_OUTPUT"

      - name: Build in COPR
        if: steps.update.outputs.specs != ''
        env:
          COPR_CONFIG: ${{ secrets.COPR_CONFIG }}
          SPECS: ${{ steps.update.outputs.specs }}
        run: |
          set -euo pipefail
          test -n "$COPR_CONFIG" || { echo "COPR_CONFIG secret is not set" >&2; exit 1; }
          read -r -a specs <<< "$SPECS"
          python3 -m venv "$RUNNER_TEMP/copr"
          "$RUNNER_TEMP/copr/bin/pip" install copr-cli rich
          install -d -m 0700 "$HOME/.config"
          install -m 0600 /dev/stdin "$HOME/.config/copr" <<< "$COPR_CONFIG"
          "$RUNNER_TEMP/copr/bin/copr-cli" build hmcl "${specs[@]}"

      - name: Commit update
        if: steps.update.outputs.specs != ''
        env:
          SPECS: ${{ steps.update.outputs.specs }}
        run: |
          set -euo pipefail
          read -r -a specs <<< "$SPECS"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "${specs[@]}"
          git commit -m "update hmcl"
          git push origin HEAD:main
